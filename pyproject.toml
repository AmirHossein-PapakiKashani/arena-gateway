[project]
name = "arena-gateway"
version = "0.1.0"
description = "Local OpenAI and Gemini compatible gateway for arena.ai"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "playwright>=1.51.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0"
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
